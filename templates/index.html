<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGROBOAT | CODE TO GROWTH</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
html,body{
height:100%;
width:100%;
}

body{
min-height:100svh;
padding:10px; /* ✅ added for mobile spacing */
background-image:linear-gradient(rgba(0,0,0,0.4),rgba(0,0,0,0.4)),
url("{{ url_for('static', filename='agro3.png') }}");
background-size:cover;
background-position:center;
background-attachment:fixed;
display:flex;
align-items:center;
justify-content:center;
}

/* ✅ UPDATED scaling */
.chat-container{
width:100%;
max-width:420px;
height:100%;
max-height:90vh;
min-height:500px;
background:rgba(2,6,23,0.85);
backdrop-filter:blur(12px);
border-radius:18px;
display:flex;
flex-direction:column;
overflow:hidden;
box-shadow:0 20px 50px rgba(0,0,0,0.4);
}

/* ✅ Mobile fix */
@media (max-width: 480px){
.chat-container{
height:100%;
max-height:100vh;
border-radius:0;
}

body{
padding:0;
}
}

.chat-header{
background:linear-gradient(135deg,#22c55e,#16a34a);
padding:16px;
text-align:center;
color:white;
}

.chat-box{
flex:1;
padding:15px;
overflow-y:auto;
display:flex;
flex-direction:column;
gap:12px;
background:#030c29;
}

.message{
max-width:80%;
padding:10px 14px;
border-radius:14px;
font-size:0.9rem;
line-height:1.4;
white-space:pre-line;
animation:fadeIn .3s ease;
}

.bot{background:#1e293b;color:#e5e7eb;align-self:flex-start;}
.user{background:#22c55e;color:#022c22;align-self:flex-end;}

.time{
font-size:.65rem;
opacity:.6;
margin-top:4px;
}

.typing{
font-size:.8rem;
opacity:.7;
}

.chat-input{
display:flex;
padding:10px;
background:#020617;
}

.chat-input input{
flex:1;
padding:10px;
border-radius:10px;
border:none;
background:#1e293b;
color:white;
}

.chat-input button{
margin-left:8px;
background:#22c55e;
border:none;
padding:0 16px;
border-radius:10px;
cursor:pointer;
}

.quick-area{display:flex;flex-wrap:wrap;gap:6px;}

.quick{
background:#1e293b;
color:#e5e7eb;
border:none;
padding:6px 10px;
border-radius:8px;
cursor:pointer;
font-size:.75rem;
}

.quick:hover{background:#334155;}
#micBtn{background:#0ea5e9;color:white;}

@keyframes fadeIn{
from{opacity:0;transform:translateY(6px);}
to{opacity:1;transform:translateY(0);}
}
</style>
</head>

<body>

<div class="chat-container">
<div class="chat-header">
<h1>🌱 AGROBOAT</h1>
<p>Powered by CODE TO GROWTH</p>
<div style="margin-top:6px;font-size:.75rem;">
Logged in as <b>{{ session.get("farmer_name", session.get("username", "Farmer")) }}</b>
<a href="{{ url_for('logout') }}" style="color:white;margin-left:8px;">Logout</a>
</div>

<select id="langSelect" style="margin-top:8px;padding:6px;border-radius:8px;">
<option value="auto">🌐 Auto</option>
<option value="en">English</option>
<option value="hi">Hindi</option>
<option value="bn">Bengali</option>
<option value="ta">Tamil</option>
<option value="te">Telugu</option>
<option value="mr">Marathi</option>
<option value="gu">Gujarati</option>
<option value="kn">Kannada</option>
<option value="ml">Malayalam</option>
<option value="pa">Punjabi</option>
<option value="or">Odia</option>
<option value="as">Assamese</option>
<option value="ur">Urdu</option>
<option value="ne">Nepali</option>
<option value="kok">Konkani</option>
<option value="mai">Maithili</option>
<option value="sd">Sindhi</option>
<option value="mni">Manipuri</option>
<option value="doi">Dogri</option>
<option value="ks">Kashmiri</option>
<option value="sat">Santali</option>
<option value="bho">Bhojpuri</option>
</select>

</div>

<div class="chat-box" id="chatBox">

<div class="message bot">
Hello 👋 I'm <b>AGROBOAT</b>.
How can I help you today?
<div class="time">Just now</div>
</div>

<div class="quick-area">
<button class="quick" onclick="quickMsg('Check weather')">Weather</button>
<button class="quick" onclick="quickMsg('Fertilizer recommendation')">Fertilizer</button>
<button class="quick" onclick="quickMsg('Crop suggestion')">Crop</button>
<button class="quick" onclick="quickMsg('Government schemes for farmers')">Schemes</button>
</div>

</div>

<div class="chat-input">
<input id="userInput" placeholder="Type your message..." autocomplete="off"/>
<button id="micBtn">🎤</button>

<input type="file" id="imageInput" accept="image/*" capture="environment" hidden>
<button onclick="openCamera()">📷</button>

<button onclick="sendMessage()">Send</button>
</div>
</div>

<script>
const chatBox=document.getElementById("chatBox");
const userInput=document.getElementById("userInput");
const micBtn=document.getElementById("micBtn");

userInput.focus();

let currentLang="auto";

document.getElementById("langSelect").addEventListener("change",(e)=>{
currentLang=e.target.value;
});

function timeNow(){
return new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}

function addMessage(text,sender){
const msg=document.createElement("div");
msg.classList.add("message",sender);
msg.innerHTML=text + `<div class="time">${timeNow()}</div>`;
chatBox.appendChild(msg);
chatBox.scrollTop=chatBox.scrollHeight;
}

function showTyping(){
const typing=document.createElement("div");
typing.classList.add("message","bot","typing");
typing.id="typing";
typing.innerText="AGROBOAT is typing...";
chatBox.appendChild(typing);
chatBox.scrollTop=chatBox.scrollHeight;
}

function removeTyping(){
const t=document.getElementById("typing");
if(t) t.remove();
}

function sendMessage(){
const text=userInput.value.trim();
if(!text) return;

addMessage(text,"user");
userInput.value="";

showTyping();

fetch("/chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
message:text,
lang:currentLang
})
})
.then(r=>r.json())
.then(d=>{
removeTyping();
addMessage(d.reply,"bot");
})
.catch(()=>{
removeTyping();
addMessage("Server error","bot");
});
}

function quickMsg(text){
userInput.value=text;
sendMessage();
}

userInput.addEventListener("keypress",e=>{
if(e.key==="Enter") sendMessage();
});

const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;

if(SpeechRecognition){
const recognition=new SpeechRecognition();

micBtn.onclick=()=>{
recognition.lang = currentLang==="hi" ? "hi-IN" :
                   currentLang==="bn" ? "bn-IN" :
                   "en-IN";
recognition.start();
micBtn.style.background="red";
};

recognition.onresult=e=>{
userInput.value=e.results[0][0].transcript;
sendMessage();
};

recognition.onend=()=>micBtn.style.background="#0ea5e9";
}else{
micBtn.disabled=true;
}

function openCamera(){
document.getElementById("imageInput").click();
}

document.getElementById("imageInput").addEventListener("change", function(){
const file=this.files[0];
if(!file) return;

addMessage("📷 Image uploaded","user");
showTyping();

const formData=new FormData();
formData.append("image",file);
formData.append("lang",currentLang);

fetch("/detect_disease",{
method:"POST",
body:formData
})
.then(res=>res.json())
.then(data=>{
removeTyping();

let result = `
🌿 <b>Detected Disease:</b> ${data.disease || "Unknown"}<br>
🔍 <b>Symptoms:</b> ${data.symptoms || "Not detected"}<br><br>
💡 ${data.reply}
`;

addMessage(result,"bot");
})
.catch(()=>{
removeTyping();
addMessage("Error analyzing image","bot");
});
});
</script>

</body>
</html>
